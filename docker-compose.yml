# SoulAuth 本地开发编排。
#
# 状态：每次推送由 CI 执行（.github/workflows/ci.yml 的 `docker` job）——
#    起服务、健康检查、从日志取引导令牌、建第一个管理员、登录、访问受保护端点，
#    再重启一次确认 schema-init 在已初始化的库上仍然放行。
#
#    这个 job 存在的理由是一条流程要求，不是形式：本仓库出过一次「部署文档
#    照着做跑不通」的问题，此后的约定是 —— 可执行文档必须真的被执行过。
#    这份文件最初带着「未经运行验证」的横幅躺了一段时间，因为编写它的环境
#    没有 Docker；而 runner 有，所以它现在由 CI 顶着。
#
# 用法：
#     cp .env.example .env      # 至少填 JWT_SECRET
#     docker compose up -d
#     curl http://localhost:8080/health
#     docker compose logs -f soulauth      # 引导令牌打印在这里
#
# 它解决的是公开文档 03｜Quickstart 的这条硬要求：
#
#     「第一次运行不需要，也不应该要求你直接连接 SurrealDB、
#       手工创建表或修改数据库记录。」
#
# 因此 schema 导入由 schema-init 这个一次性服务完成，而不是要求开发者
# 自己装 SurrealDB CLI 再跑两条 import。
#
# 生产部署不要用这份文件：这里的口令是开发默认值，SurrealDB 也没有 TLS。
# 生产路径见 DEPLOYMENT.md。

name: soulauth

services:
  surrealdb:
    # ⚠ **钉 v3.0.5,不要跟着 latest 走。**(2026-09-28)
    #
    # 此前是 v3.2.4,而本仓的客户端 crate 是 `surrealdb = "3.0.0"` —— 跨了两个小版本。
    # 后果是实测出来的,不是推测:
    #
    #   · 该服务端**所有请求返 `Method not allowed`**,连容器自带的
    #     `/surreal isready` 连自己都一样(对照:v3.0.5 同一条命令返 OK)
    #   · 健康探针自 2026-09-16 启动起**失败 11594 次** —— 不是抓发,是从第一天就不应
    #   · soulauth 启动时建立的那条长连接撑了十天,断了之后**重连再也上不去**
    #
    # ▎对外表现是 `/api/auth/login` 返 `service_unavailable` ——
    #   **看着像「服务忙」,而真实原因是版本歪。** 那一躺就是十二天。
    #
    # 升级前先把客户端 crate 一起升,并在本机验一次 `isready`。
    #
    # ============================ 2026-10-07:v3.0.5 → v3.3.0 ============================
    #
    # **照上面那条指令做的**:客户端 crate 同刀升到 `=3.3.0`(见 `Cargo.toml`),
    # 不是只动镜像。上一次事故的成因是客户端 3.0.0 对服务端 3.2.4 ——
    # 只升一边就是把同一个错配换个方向重演。
    #
    # ⚠ **本文件里有三处镜像,都要改**:本服务、`schema-init`、`seed-init`。
    #   后两个用同一镜像跑 `/surreal import` —— 版本歪了会用不同的解析器导入 schema,
    #   而那种歪不会在启动时报错,只会让某些语句的语义悄悄不同。
    #
    # 本机取证(`isready` + Quickstart 全程)见本次 PR。
    image: surrealdb/surrealdb:v3.3.0
    # ⚠ **`user: 0:0` 不是偷懒,是这台机器上唯一能持久化的走法。**(2026-09-28)
    #
    # 镜像跑的是 UID 65532,而 compose 新建的具名卷是 `0:0 755` ——
    # 于是 surreal 建不了库目录:`Failed to create RocksDB directory: PermissionDenied`。
    # 常规解法是先起个 init 容器 chown 一遍,**在 Docker Desktop for Windows 上不成立**:
    # 实测 chown 在容器内生效,换个容器再 stat 又变回 `0:0` —— 该卷后端不保留属主。
    # 所以只能让 surreal 以 root 跑。生产上换成属主正确的 bind mount 或 K8s fsGroup。
    user: "0:0"
    command:
      - start
      - --bind=0.0.0.0:8000
      - --user=root
      - --pass=root
      # ⚠ **不是 `file:`。**`file:` 在 SurrealDB 3.x 上已经不存在了 ——
      # v3.0.5 启动直接 exit 1:`Unable to load the specified datastore`。
      # 原先这里写的正是 `file:/data/soulauth.db`,所以这套栈**从来没有持久化过**:
      # 拆栈前查过那个卷,是空的。
      - rocksdb:/data/soulauth.db
    volumes:
      - surreal-data:/data
    healthcheck:
      # 用 CLI 自带的探针：这个镜像是 scratch 底，连 /bin/sh 都没有，更没有 curl。
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # 一次性服务：把 schema 与种子数据导进去，成功后退出。
  #
  # 用 SurrealDB 官方镜像而不是在应用里做运行期 DDL —— 认证服务不应该拥有
  # 改自己表结构的权限，那条边界在 DEPLOYMENT.md 里已经定了。
  #
  # ⚠ **不要给它包 shell。**(2026-09-28)
  #
  # 此前这里是 `entrypoint: ["/bin/sh","-c"]` 加一段「先探测 role:admin 再决定导不导」
  # 的条件脚本。**这个镜像里没有 /bin/sh** —— 容器状态永远停在 `Created`,exit 127,
  # `stat /bin/sh: no such file or directory`。而 soulauth 依赖它
  # `service_completed_successfully`,于是 `docker compose up` **从来就拉不起这套栈**;
  # 现网那套是手起的。
  #
  # ▎那段脚本要防的事**不存在**。实测(v3.0.5,本机,2026-09-28):
  #   · `/surreal import` 在已初始化的库上重跑 → `Import executed with no errors`,rc=0
  #   · schema.sql 连导 4 次、initial_data.sql 连导 2 次,全 rc=0,role 表仍是 5 行、不翻倍
  #   · 全新库上 CLI import 会自己建 namespace/database
  #     (对照:HTTP `/import` **不会**,返 `The namespace 'auth' does not exist`)
  #   原注释说「195 条 DEFINE 只有 8 条带 IF NOT EXISTS,重跑会报 already exists 而退出非零」——
  #   条数也不对(实为 262 条 DEFINE、8 条 IF NOT EXISTS),结论更不对:import 不因此失败。
  #
  # 所以无条件导入即可:不需要 shell,不需要判据,拆成两个服务串起来。
  #
  # ▎`--endpoint` 不是 `--conn`:后者是 SurrealDB 2.x 之前的写法,3.x 上报错且不提示。
  schema-init:
    image: surrealdb/surrealdb:v3.3.0
    depends_on:
      surrealdb:
        condition: service_healthy
    volumes:
      - ./schema.sql:/sql/schema.sql:ro
    entrypoint: ["/surreal"]
    command:
      - import
      - --endpoint=http://surrealdb:8000
      - --user=root
      - --pass=root
      - --namespace=auth
      - --database=main
      - /sql/schema.sql
    restart: "no"

  # 种子数据单独一步：compose 的 command 只能带一条命令，而没有 shell 串不起两个文件。
  seed-init:
    image: surrealdb/surrealdb:v3.3.0
    depends_on:
      schema-init:
        condition: service_completed_successfully
    volumes:
      - ./initial_data.sql:/sql/initial_data.sql:ro
    entrypoint: ["/surreal"]
    command:
      - import
      - --endpoint=http://surrealdb:8000
      - --user=root
      - --pass=root
      - --namespace=auth
      - --database=main
      - /sql/initial_data.sql
    restart: "no"

  soulauth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      seed-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # 覆盖 .env 里指向宿主机的默认值：容器内要走服务名。
      DATABASE_URL: surrealdb:8000
      DATABASE_USER: root
      DATABASE_PASS: root
      DATABASE_NAMESPACE: auth
      DATABASE_NAME: main
      BIND_ADDR: 0.0.0.0:8080
      # 环回地址 → 不触发生产闸门，OIDC 私钥与 MFA 密钥因此不是必填。
      # 这正是开发默认值不能用于生产的原因。
      APP_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  surreal-data:
